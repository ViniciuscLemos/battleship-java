name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the LTS I wrote it on and the newest one
        java: [17, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        run: javac -encoding UTF-8 -Xlint:all -Werror -d out $(find src -name "*.java")
      - name: Tests
        run: java -cp out battleship.BattleshipTest
